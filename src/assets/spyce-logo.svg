<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Spyce logo</title>
  <defs>
    <!-- Raised (extruded) soft shadow: light top-left, dark bottom-right -->
    <filter id="raised" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feOffset in="b" dx="12" dy="12" result="o1"/>
      <feFlood flood-color="#101010" flood-opacity="0.95"/>
      <feComposite in2="o1" operator="in" result="dark"/>
      <feOffset in="b" dx="-12" dy="-12" result="o2"/>
      <feFlood flood-color="#4a4a4a" flood-opacity="0.85"/>
      <feComposite in2="o2" operator="in" result="light"/>
      <feMerge>
        <feMergeNode in="dark"/>
        <feMergeNode in="light"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Smaller raised shadow for the symbol -->
    <filter id="raisedSm" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feOffset in="b" dx="6" dy="6" result="o1"/>
      <feFlood flood-color="#0e0e0e" flood-opacity="0.95"/>
      <feComposite in2="o1" operator="in" result="dark"/>
      <feOffset in="b" dx="-6" dy="-6" result="o2"/>
      <feFlood flood-color="#4a4a4a" flood-opacity="0.8"/>
      <feComposite in2="o2" operator="in" result="light"/>
      <feMerge>
        <feMergeNode in="dark"/>
        <feMergeNode in="light"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inset (pressed) well -->
    <filter id="inset" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="inv">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur in="inv" stdDeviation="10" result="invBlur"/>
      <feOffset in="invBlur" dx="10" dy="10" result="offDark"/>
      <feFlood flood-color="#0f0f0f" flood-opacity="0.95"/>
      <feComposite in2="offDark" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="innerDark"/>
      <feOffset in="invBlur" dx="-10" dy="-10" result="offLight"/>
      <feFlood flood-color="#4a4a4a" flood-opacity="0.75"/>
      <feComposite in2="offLight" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="innerLight"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="innerDark"/>
        <feMergeNode in="innerLight"/>
      </feMerge>
    </filter>

    <!-- Soft orange glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="g"/>
      <feFlood flood-color="#ff6a00" flood-opacity="0.55"/>
      <feComposite in2="g" operator="in" result="glowColor"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feOffset in="b" dx="6" dy="6" result="o1"/>
      <feFlood flood-color="#0e0e0e" flood-opacity="0.8"/>
      <feComposite in2="o1" operator="in" result="dark"/>
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="dark"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a33"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>

    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#282828"/>
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="512" height="512" fill="#2b2b2b"/>

  <!-- App icon tile (raised) -->
  <rect x="56" y="56" width="400" height="400" rx="104" fill="url(#surface)" filter="url(#raised)"/>

  <!-- Inset well around the symbol -->
  <circle cx="256" cy="256" r="138" fill="#2a2a2a" filter="url(#inset)"/>

  <!-- Music note body: notehead + stem (same matte gray, extruded) -->
  <g filter="url(#raisedSm)" fill="#2d2d2d">
    <ellipse cx="222" cy="326" rx="40" ry="31" transform="rotate(-20 222 326)"/>
    <rect x="252" y="170" width="18" height="150" rx="9"/>
  </g>

  <!-- Flame flag (orange, glowing) -->
  <path filter="url(#glow)" fill="url(#orange)"
        d="M262 160
           C 304 178 348 204 338 258
           C 333 284 314 298 294 302
           C 304 278 294 264 281 254
           C 277 238 271 224 262 214 Z"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
